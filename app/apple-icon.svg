<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#080e1a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Border Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8" />
    </linearGradient>

    <!-- Main Trend Surge Gradient -->
    <linearGradient id="surgeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#6366f1" />
      <stop offset="85%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Bar 1 Gradient -->
    <linearGradient id="bar1Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.3" />
    </linearGradient>

    <!-- Bar 2 Gradient -->
    <linearGradient id="bar2Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#4338ca" stop-opacity="0.35" />
    </linearGradient>

    <!-- Bar 3 Gradient -->
    <linearGradient id="bar3Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#7e22ce" stop-opacity="0.4" />
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Squircle Background -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="url(#ringGrad)" stroke-width="10" />

  <!-- Inner Ambient Light -->
  <circle cx="256" cy="230" r="170" fill="#38bdf8" opacity="0.07" filter="url(#neonGlow)" />
  <circle cx="360" cy="160" r="120" fill="#10b981" opacity="0.08" filter="url(#neonGlow)" />

  <!-- Financial Candlestick / Bar Chart -->
  <!-- Bar 1 (Left) -->
  <line x1="135" y1="260" x2="135" y2="400" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.5" />
  <rect x="114" y="290" width="42" height="95" rx="10" fill="url(#bar1Grad)" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.6" />

  <!-- Bar 2 (Middle) -->
  <line x1="225" y1="190" x2="225" y2="400" stroke="#818cf8" stroke-width="4" stroke-linecap="round" opacity="0.5" />
  <rect x="204" y="225" width="42" height="160" rx="10" fill="url(#bar2Grad)" stroke="#818cf8" stroke-width="2.5" stroke-opacity="0.7" />

  <!-- Bar 3 (Right) -->
  <line x1="315" y1="130" x2="315" y2="400" stroke="#c084fc" stroke-width="4" stroke-linecap="round" opacity="0.5" />
  <rect x="294" y="165" width="42" height="220" rx="10" fill="url(#bar3Grad)" stroke="#c084fc" stroke-width="2.5" stroke-opacity="0.8" />

  <!-- Dynamic Upward Trend Wave with Glow -->
  <path d="M 85 365 C 160 365, 185 275, 260 235 C 315 205, 335 185, 405 125" 
        fill="none" 
        stroke="#10b981" 
        stroke-width="26" 
        stroke-linecap="round" 
        opacity="0.3" 
        filter="url(#neonGlow)" />

  <path d="M 85 365 C 160 365, 185 275, 260 235 C 315 205, 335 185, 405 125" 
        fill="none" 
        stroke="url(#surgeGrad)" 
        stroke-width="16" 
        stroke-linecap="round" />

  <!-- Trend Arrowhead -->
  <path d="M 330 115 L 420 115 L 420 205" 
        fill="none" 
        stroke="url(#surgeGrad)" 
        stroke-width="16" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- AI / Decision Sparkle (4-point Star) -->
  <g transform="translate(425, 105)" filter="url(#subtleGlow)">
    <path d="M 0 -22 C 0 -6, 6 0, 22 0 C 6 0, 0 6, 0 22 C 0 6, -6 0, -22 0 C -6 0, 0 -6, 0 -22 Z" 
          fill="#34d399" />
    <circle cx="0" cy="0" r="4.5" fill="#ffffff" />
  </g>

  <!-- Small accent pulse on node 260, 235 -->
  <circle cx="260" cy="235" r="7" fill="#ffffff" stroke="#6366f1" stroke-width="3.5" filter="url(#subtleGlow)" />
</svg>
